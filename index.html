<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tipografía Inter, igual que el resto de empleados de Empleia -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Empleia · Panel Unificado</title>
  </head>
  <body>
    <!--
      Contenido de reserva DENTRO de #root: React lo reemplaza al montarse.
      Si este texto se queda fijo, el JavaScript no se está ejecutando.
    -->
    <div id="root">
      <div
        id="diag"
        style="min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #9aa0b4; font: 13px/1.6 system-ui, sans-serif; text-align: center; padding: 24px; background: #0b0d14;"
      >
        Cargando Empleia…
      </div>
    </div>

    <!-- Captura global de errores: si la app no arranca, muestra la causa en
         pantalla en vez de dejarla en negro (útil al probar en iPad/Safari). -->
    <script>
      function pintarError(msg) {
        var diag = document.getElementById('diag')
        if (diag && diag.textContent.indexOf('ERROR JS') === -1) {
          diag.style.color = '#f59e0b'
          diag.textContent = 'ERROR JS: ' + msg
        }
      }
      window.addEventListener('error', function (e) {
        pintarError((e && e.message) || (e && e.error && e.error.message) || 'error desconocido')
      })
      window.addEventListener('unhandledrejection', function (e) {
        var r = e && e.reason
        pintarError((r && r.message) || String(r || 'promesa rechazada'))
      })
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
